<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#060A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>AirMic · 手机麦克风</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #060a12;
    --mint: #5eead4;
    --teal: #2dd4bf;
    --indigo: #818cf8;
    --ink: #f8fafc;
    --muted: #8a97a8;
    --muted-2: #5f6b7c;
    --line: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.045);
    --warning: #fbbf5c;
    --danger: #fb7185;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); }
  body {
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 50% -16%, rgba(94, 234, 212, 0.105), transparent 62%),
      radial-gradient(800px 620px at 105% 68%, rgba(129, 140, 248, 0.11), transparent 66%),
      radial-gradient(700px 600px at -10% 88%, rgba(45, 212, 191, 0.07), transparent 62%),
      linear-gradient(180deg, #071019 0%, #060a12 48%, #05080f 100%);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.06) 0.6px, transparent 0.6px);
    background-size: 18px 18px;
    opacity: 0.20;
    mask-image: linear-gradient(180deg, black, transparent 76%);
    -webkit-mask-image: linear-gradient(180deg, black, transparent 76%);
  }
  .shell {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 20px) 22px calc(var(--safe-bottom) + 22px);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #6ff5df, #2dd4bf 56%, #7c86f8);
    box-shadow: 0 8px 26px rgba(94, 234, 212, 0.22), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .logo svg { width: 23px; height: 23px; }
  .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
  .brand-sub { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted-2); margin-top: 1px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--line);
    font-size: 10px; font-weight: 700; color: var(--muted);
    white-space: nowrap;
    transition: color .25s, border-color .25s, background .25s;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #f4c15d; box-shadow: 0 0 8px rgba(244,193,93,.7); }
  .pill.online { color: var(--mint); border-color: rgba(94,234,212,.20); background: rgba(94,234,212,.08); }
  .pill.online .dot { background: var(--mint); box-shadow: 0 0 9px rgba(94,234,212,.8); }
  .pill.live { color: var(--mint); border-color: rgba(94,234,212,.28); background: rgba(94,234,212,.10); }
  .pill.live .dot { animation: dotPulse 1.8s ease-in-out infinite; }

  main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; padding: 18px 0 8px; }
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .orb-wrap {
    position: relative; width: 252px; height: 252px;
    display: grid; place-items: center;
    margin-top: 0;
  }
  .ring {
    position: absolute; inset: 50% auto auto 50%;
    width: 152px; height: 152px; border-radius: 50%;
    border: 1px solid rgba(94, 234, 212, 0.15);
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    pointer-events: none;
  }
  .live .ring { animation: ripple 2.8s cubic-bezier(.2,.65,.35,1) infinite; }
  .live .ring:nth-child(2) { animation-delay: .9s; }
  .live .ring:nth-child(3) { animation-delay: 1.8s; }
  .orb {
    position: relative; z-index: 2;
    width: 146px; height: 146px; border-radius: 50%;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.15), transparent 32%),
      radial-gradient(circle at 50% 80%, rgba(94,234,212,.18), transparent 62%),
      linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.13);
    box-shadow:
      0 24px 64px rgba(0,0,0,.46),
      inset 0 1px 0 rgba(255,255,255,.13),
      0 0 0 12px rgba(94,234,212,.018);
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .orb::after {
    content: ""; position: absolute; inset: 13px; border-radius: 50%;
    border: 1px solid rgba(94,234,212,.12);
  }
  .live .orb {
    transform: scale(1.035);
    border-color: rgba(94,234,212,.30);
    box-shadow:
      0 26px 76px rgba(0,0,0,.48),
      inset 0 1px 0 rgba(255,255,255,.17),
      0 0 54px rgba(94,234,212,.16);
    animation: breathe 3s ease-in-out infinite;
  }
  .orb svg { width: 45px; height: 45px; color: rgba(255,255,255,.50); transition: color .3s; }
  .live .orb svg { color: var(--mint); filter: drop-shadow(0 0 10px rgba(94,234,212,.45)); }
  .orb-bars {
    position: absolute; bottom: 23px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 3px; height: 18px; opacity: 0;
    transition: opacity .3s;
  }
  .live .orb-bars { opacity: 1; }
  .orb-bars i {
    display: block; width: 3px; border-radius: 4px; background: var(--mint);
    height: 4px; box-shadow: 0 0 6px rgba(94,234,212,.35);
  }
  .live .orb-bars i { animation: barDance .9s ease-in-out infinite alternate; }
  .orb-bars i:nth-child(2) { animation-delay: .12s; }
  .orb-bars i:nth-child(3) { animation-delay: .24s; }
  .orb-bars i:nth-child(4) { animation-delay: .36s; }
  .orb-bars i:nth-child(5) { animation-delay: .48s; }
  .orb-bars i:nth-child(6) { animation-delay: .60s; }
  .orb-bars i:nth-child(7) { animation-delay: .72s; }

  .status {
    margin-top: 5px; font-size: 24px; font-weight: 800; letter-spacing: -0.035em;
    line-height: 1.24;
  }
  .sub {
    margin-top: 7px; max-width: 300px;
    font-size: 12.5px; line-height: 1.55; font-weight: 500; color: var(--muted);
    min-height: 39px;
  }
  .metrics {
    width: 100%; margin-top: 18px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .metric {
    min-width: 0; padding: 10px 8px 9px; border-radius: 14px;
    background: rgba(255,255,255,.038);
    border: 1px solid rgba(255,255,255,.065);
    text-align: left;
  }
  .metric span { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted-2); }
  .metric b {
    display: block; margin-top: 4px; font-size: 13px; font-weight: 700;
    color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metric b em { font-style: normal; font-size: 9px; font-weight: 600; color: var(--muted-2); margin-left: 2px; }

  .level-card {
    margin-top: 10px; padding: 12px 13px;
    border-radius: 16px;
    background: rgba(255,255,255,.032);
    border: 1px solid rgba(255,255,255,.06);
    transition: opacity .3s;
  }
  .level-card.idle { opacity: .46; }
  .level-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .level-head span:first-child { font-size: 9.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
  .level-head span:last-child { font-size: 9.5px; font-weight: 700; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }
  .level-track { height: 6px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.055); }
  .level-fill {
    width: 2%; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #5eead4, #2dd4bf 62%, #fbbf5c);
    box-shadow: 0 0 12px rgba(94,234,212,.30);
    transition: width .075s linear;
  }
  .gain-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 11px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.05);
  }
  .gain-label { font-size: 9.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 99px; outline: none;
    background: linear-gradient(90deg, rgba(94,234,212,.55), rgba(255,255,255,.10));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 17px; height: 17px; border-radius: 50%;
    background: #eafffb; border: 3px solid #2dd4bf;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .gain-value { font-size: 9.5px; font-weight: 700; color: rgba(255,255,255,.48); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }

  footer { flex: 0 0 auto; padding-top: 12px; }
  .main-btn {
    position: relative; width: 100%; height: 58px; border: 0; border-radius: 18px;
    font-family: inherit; font-size: 16.5px; font-weight: 800; letter-spacing: .01em;
    color: #04110e; cursor: pointer;
    background: linear-gradient(135deg, #7ef7e2, #5eead4 46%, #35c9b7);
    box-shadow: 0 12px 36px rgba(45,212,191,.24), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .16s ease, box-shadow .2s, background .25s, color .25s, opacity .2s;
    -webkit-user-select: none; user-select: none;
  }
  .main-btn:active { transform: scale(.985); }
  .main-btn:disabled { opacity: .62; cursor: default; }
  .main-btn.live {
    color: #ffd7db;
    background: linear-gradient(135deg, rgba(251,113,133,.18), rgba(251,113,133,.10));
    border: 1px solid rgba(251,113,133,.30);
    box-shadow: 0 8px 30px rgba(251,113,133,.08), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .main-btn .btn-inner { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .btn-icon { width: 17px; height: 17px; display: inline-flex; }
  .hint {
    margin: 10px auto 0; max-width: 340px; text-align: center;
    font-size: 10px; line-height: 1.5; font-weight: 500; color: var(--muted-2);
  }
  .hint strong { color: rgba(255,255,255,.48); font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 94px);
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    width: min(88vw, 390px); padding: 11px 14px;
    border-radius: 13px; background: rgba(10,16,26,.94);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 14px 36px rgba(0,0,0,.45);
    font-size: 11px; line-height: 1.5; font-weight: 600; color: rgba(255,255,255,.86);
    text-align: center; z-index: 20;
    transition: opacity .25s, transform .25s;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { border-color: rgba(251,113,133,.28); color: #ffd9df; }

  .error-panel {
    display: none; margin: 14px 0 0; padding: 14px;
    border-radius: 15px; text-align: left;
    background: rgba(251,113,133,.075);
    border: 1px solid rgba(251,113,133,.20);
  }
  .error-panel.show { display: block; }
  .error-panel b { display: block; font-size: 12px; color: #ffd4da; margin-bottom: 4px; }
  .error-panel p { margin: 0; font-size: 10.5px; line-height: 1.6; color: rgba(255,214,220,.72); }
  .error-panel button {
    margin-top: 10px; border: 1px solid rgba(251,113,133,.25); background: rgba(251,113,133,.10);
    color: #ffd4da; border-radius: 9px; padding: 7px 11px;
    font-family: inherit; font-size: 10.5px; font-weight: 700;
  }

  @keyframes ripple {
    0% { opacity: .7; transform: translate(-50%, -50%) scale(.72); }
    70% { opacity: .10; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.62); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1.035); }
    50% { transform: scale(1.075); }
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 9px rgba(94,234,212,.8); }
    50% { opacity: .5; box-shadow: 0 0 3px rgba(94,234,212,.35); }
  }
  @keyframes barDance {
    from { height: 4px; opacity: .55; }
    to { height: 16px; opacity: 1; }
  }
  @media (max-height: 680px) {
    .orb-wrap { width: 205px; height: 205px; }
    .orb { width: 124px; height: 124px; }
    .orb svg { width: 38px; height: 38px; }
    .status { font-size: 21px; }
    .sub { margin-top: 5px; font-size: 11.5px; min-height: 34px; }
    .metrics { margin-top: 13px; }
    .main-btn { height: 52px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04110e" stroke-width="2.3" stroke-linecap="round">
          <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">AirMic</div>
        <span class="brand-sub">PHONE MICROPHONE</span>
      </div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillText">Mac 在线</span></div>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="orb-wrap">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11.2a6.5 6.5 0 0 0 13 0M12 17.8V21M8.7 21h6.6"></path>
          </svg>
          <div class="orb-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <div class="status" id="status">等待开麦</div>
      <div class="sub" id="sub">点一下下方按钮，把手机变成 Mac 的无线麦克风。声音只在局域网内传输。</div>

      <div class="metrics">
        <div class="metric"><span>延迟</span><b id="latency">—</b></div>
        <div class="metric"><span>音质</span><b id="quality">48 kHz</b></div>
        <div class="metric"><span>状态</span><b id="liveState">待机</b></div>
      </div>

      <div class="level-card idle" id="levelCard">
        <div class="level-head"><span>输入电平</span><span id="levelPct">0%</span></div>
        <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
        <div class="gain-row">
          <span class="gain-label">输入增益</span>
          <input id="gain" type="range" min="0.4" max="4" step="0.1" value="1" aria-label="输入增益">
          <span class="gain-value" id="gainValue">1.0×</span>
        </div>
      </div>

      <div class="error-panel" id="errorPanel">
        <b id="errorTitle">无法启动麦克风</b>
        <p id="errorText"></p>
        <button id="retryBtn" type="button">重试</button>
      </div>
    </section>
  </main>

  <footer>
    <button class="main-btn" id="mainBtn" type="button">
      <span class="btn-inner">
        <span class="btn-icon" id="btnIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19v3M8 22h8M5 10v2a7 7 0 0 0 14 0v-2"/><rect x="9" y="2" width="6" height="11" rx="3"/></svg>
        </span>
        <span id="btnText">开始传音</span>
      </span>
    </button>
    <p class="hint" id="hint">请保持本页在前台 · 建议横放手机靠近声源 · 使用 Mac 扬声器播放</p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const el = {
    shell: $("shell"), hero: $("hero"), pill: $("pill"), pillText: $("pillText"),
    status: $("status"), sub: $("sub"), latency: $("latency"), quality: $("quality"),
    liveState: $("liveState"), levelCard: $("levelCard"), levelFill: $("levelFill"),
    levelPct: $("levelPct"), gain: $("gain"), gainValue: $("gainValue"),
    mainBtn: $("mainBtn"), btnText: $("btnText"), btnIcon: $("btnIcon"),
    hint: $("hint"), toast: $("toast"), errorPanel: $("errorPanel"),
    errorTitle: $("errorTitle"), errorText: $("errorText"), retryBtn: $("retryBtn")
  };

  const state = {
    running: false, starting: false, stopping: false, connected: false,
    ws: null, ctx: null, stream: null, source: null, node: null, gainNode: null,
    analyser: null, wakeLock: null, timer: null, pingTimer: null, meterTimer: null,
    startedAt: 0, lastStatsAt: 0, rtt: 0, bufferMs: 0, kbps: 0, sampleRate: 0,
    sentFrames: 0, droppedFrames: 0, intentionalStop: false, lastLevelAt: 0,
    level: 0, gainValue: 1.0, serverLatencyMs: 0, channel: 0
  };

  function toast(message, isError = false, duration = 3600) {
    el.toast.textContent = message;
    el.toast.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { el.toast.className = "toast"; }, duration);
  }

  function setPill(mode, text) {
    el.pill.className = "pill" + (mode ? " " + mode : "");
    el.pillText.textContent = text;
  }

  function setError(title, text) {
    el.errorTitle.textContent = title || "无法启动麦克风";
    el.errorText.textContent = text || "";
    el.errorPanel.classList.add("show");
  }

  function clearError() {
    el.errorPanel.classList.remove("show");
  }

  function setStarting() {
    state.starting = true;
    el.mainBtn.disabled = true;
    el.mainBtn.classList.remove("live");
    el.btnText.textContent = "正在连接…";
    el.status.textContent = "正在请求麦克风";
    el.sub.textContent = "请在系统弹窗中允许麦克风权限。";
    el.quality.textContent = "准备中";
    el.liveState.textContent = "连接中";
    setPill("", "正在连接");
  }

  function setLive(sampleRate) {
    state.starting = false;
    el.mainBtn.disabled = false;
    el.mainBtn.classList.add("live");
    el.btnText.textContent = "停止传音";
    el.btnIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
    el.status.textContent = "正在传音";
    el.sub.textContent = state.channel
      ? "已接入 Mac · 第 " + state.channel + " 路麦克风。请保持此页面在前台。"
      : "声音已实时同步到 Mac。请保持此页面在前台。";
    el.quality.textContent = sampleRate ? (sampleRate / 1000).toFixed(1) + " kHz" : "48 kHz";
    el.liveState.textContent = "传输中";
    el.levelCard.classList.remove("idle");
    el.hint.innerHTML = "请保持本页在前台 · 建议横放手机靠近声源 · <strong>不要锁屏</strong>";
    setPill("live", "正在传音");
    el.hero.classList.add("live");
  }

  function setIdle() {
    state.starting = false;
    el.mainBtn.disabled = false;
    el.mainBtn.classList.remove("live");
    el.btnText.textContent = "开始传音";
    el.btnIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19v3M8 22h8M5 10v2a7 7 0 0 0 14 0v-2"/><rect x="9" y="2" width="6" height="11" rx="3"/></svg>';
    el.status.textContent = "等待开麦";
    el.sub.textContent = "点一下下方按钮，把手机变成 Mac 的无线麦克风。声音只在局域网内传输。";
    el.quality.textContent = "48 kHz";
    el.liveState.textContent = "待机";
    el.latency.textContent = "—";
    state.serverLatencyMs = 0;
    state.bufferMs = 0;
    state.channel = 0;
    el.levelCard.classList.add("idle");
    el.levelFill.style.width = "2%";
    el.levelPct.textContent = "0%";
    el.hint.innerHTML = "请保持本页在前台 · 建议横放手机靠近声源 · 使用 Mac 扬声器播放";
    setPill("online", "Mac 在线");
    el.hero.classList.remove("live");
  }

  function updateMeter(value) {
    state.level = Math.max(0, Math.min(1, value || 0));
    const now = performance.now();
    if (now - state.lastLevelAt < 33) return;
    state.lastLevelAt = now;
    const pct = Math.min(100, Math.round(state.level * 220));
    el.levelFill.style.width = Math.max(2, pct) + "%";
    el.levelPct.textContent = pct + "%";
  }

  function updateLatency() {
    if (!state.running) { el.latency.textContent = "—"; return; }
    const estimate = Math.max(0, Math.round(state.serverLatencyMs || (state.bufferMs + state.rtt / 2)));
    el.latency.innerHTML = estimate ? estimate + '<em>ms</em>' : "—";
  }

  function startClock() {
    state.startedAt = Date.now();
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      if (!state.running) return;
      // Keep a subtle live readout: the pill shows total elapsed transmission.
      const seconds = Math.floor((Date.now() - state.startedAt) / 1000);
      if (seconds > 0 && seconds % 30 === 0) {
        // no visual change needed; this keeps the timer lightweight
      }
    }, 1000);
  }

  async function requestWakeLock() {
    try {
      if (!("wakeLock" in navigator)) return;
      state.wakeLock = await navigator.wakeLock.request("screen");
      state.wakeLock.addEventListener("release", () => { state.wakeLock = null; });
    } catch (_) { /* iOS may deny before the page is fully visible */ }
  }

  async function releaseWakeLock() {
    try { if (state.wakeLock) await state.wakeLock.release(); } catch (_) {}
    state.wakeLock = null;
  }

  function sendPCM(buffer) {
    const ws = state.ws;
    if (!ws || ws.readyState !== 1 || !state.connected) {
      state.droppedFrames++;
      return;
    }
    // Never let a slow network turn into a growing delay. A couple of frames
    // lost is much better than seconds of lag.
    if (ws.bufferedAmount > 72 * 1024) {
      state.droppedFrames++;
      return;
    }
    try {
      ws.send(buffer);
      state.sentFrames++;
    } catch (_) {
      state.droppedFrames++;
    }
  }

  function handleServerMessage(raw) {
    let message;
    try { message = JSON.parse(raw); } catch (_) { return; }
    if (!message || typeof message.type !== "string") return;

    if (message.type === "ready") {
      state.connected = true;
      if (message.sampleRate) state.sampleRate = message.sampleRate;
      state.channel = Number(message.channel) || 0;
      setLive(state.sampleRate || state.ctx?.sampleRate || 48000);
      startClock();
      requestWakeLock();
      return;
    }
    if (message.type === "stats") {
      state.lastStatsAt = performance.now();
      state.bufferMs = Number(message.bufferMs) || 0;
      state.serverLatencyMs = Number(message.latencyMs) || 0;
      state.kbps = Number(message.kbps) || 0;
      if (message.rttMs) state.rtt = Number(message.rttMs) || state.rtt;
      if (message.sampleRate) {
        state.sampleRate = Number(message.sampleRate) || state.sampleRate;
        el.quality.textContent = (state.sampleRate / 1000).toFixed(1) + " kHz";
      }
      updateLatency();
      return;
    }
    if (message.type === "ping") {
      if (state.ws && state.ws.readyState === 1) {
        try { state.ws.send(JSON.stringify({ type: "pong", t: message.t })); } catch (_) {}
      }
      return;
    }
    if (message.type === "error") {
      setError("无法接入 Mac", message.message || "连接被拒绝，请稍后重试。");
      toast(message.message || "连接被拒绝", true, 5000);
      cleanup({ silent: true });
      return;
    }
    if (message.type === "pong") {
      if (typeof message.t === "number") {
        const sample = Math.max(0, performance.now() - message.t);
        state.rtt = state.rtt ? state.rtt * 0.65 + sample * 0.35 : sample;
        updateLatency();
      }
    }
  }

  async function connectWebSocket() {
    return new Promise((resolve, reject) => {
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      let ws;
      try {
        ws = new WebSocket(scheme + "//" + location.host + "/ws");
      } catch (error) {
        reject(new Error("无法创建连接"));
        return;
      }
      ws.binaryType = "arraybuffer";
      let settled = false;
      const timeout = setTimeout(() => {
        if (!settled) {
          settled = true;
          try { ws.close(); } catch (_) {}
          reject(new Error("连接 Mac 超时，请确认手机和 Mac 在同一 Wi-Fi。"));
        }
      }, 7000);

      ws.onopen = () => {
        state.ws = ws;
        ws.send(JSON.stringify({
          type: "hello",
          sampleRate: state.sampleRate,
          name: deviceName(),
          platform: platformName(),
          ua: navigator.userAgent
        }));
        if (!settled) {
          settled = true;
          clearTimeout(timeout);
          resolve();
        }
      };
      ws.onmessage = (event) => {
        if (typeof event.data === "string") handleServerMessage(event.data);
      };
      ws.onerror = () => {
        if (!settled) {
          settled = true;
          clearTimeout(timeout);
          reject(new Error("无法连接 Mac，请确认二维码地址可以打开。"));
        }
      };
      ws.onclose = () => {
        state.connected = false;
        clearInterval(state.pingTimer);
        state.pingTimer = null;
        if (state.running && !state.intentionalStop) {
          toast("与 Mac 的连接已断开", true);
          cleanup({ silent: true });
        }
      };
    });
  }

  async function start() {
    if (state.running || state.starting) return;
    clearError();

    if (!window.isSecureContext) {
      setError("需要安全连接", "请通过二维码中的 https:// 地址访问本页。");
      toast("请使用 https:// 地址打开本页", true);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setError("浏览器不支持麦克风", "请使用较新的 Safari、Chrome、Edge 或其他现代浏览器。");
      return;
    }

    setStarting();

    try {
      // Keep every fidelity-related processing switch off. The phone is acting
      // as a microphone, not a phone call.
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
          sampleRate: 48000
        },
        video: false
      });
      state.stream = stream;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtor({ latencyHint: "interactive", sampleRate: 48000 });
      state.ctx = ctx;
      await ctx.resume();
      state.sampleRate = ctx.sampleRate;

      const source = ctx.createMediaStreamSource(stream);
      const gain = ctx.createGain();
      gain.gain.value = state.gainValue;
      const silent = ctx.createGain();
      silent.gain.value = 0;

      let node;
      if (ctx.audioWorklet && typeof AudioWorkletNode !== "undefined") {
        await ctx.audioWorklet.addModule("/pcm-worklet.js");
        node = new AudioWorkletNode(ctx, "pcm-processor", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [1]
        });
        node.port.onmessage = (event) => {
          const data = event.data;
          if (!data) return;
          if (data.type === "pcm" && data.buffer) sendPCM(data.buffer);
          else if (data.type === "level") updateMeter(data.value);
        };
      } else {
        // Very old browsers: ScriptProcessorNode fallback.
        node = ctx.createScriptProcessor(1024, 1, 1);
        let pending = new Float32Array(Math.max(128, Math.round(ctx.sampleRate / 200)));
        let offset = 0;
        node.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < input.length; i++) {
            const value = input[i];
            sum += value * value;
            pending[offset++] = value;
            if (offset >= pending.length) {
              const pcm = new Int16Array(pending.length);
              for (let j = 0; j < pending.length; j++) {
                const s = Math.max(-1, Math.min(1, pending[j]));
                pcm[j] = s < 0 ? s * 0x8000 : s * 0x7fff;
              }
              sendPCM(pcm.buffer);
              offset = 0;
            }
          }
          updateMeter(Math.sqrt(sum / Math.max(1, input.length)) * 1.6);
        };
      }

      source.connect(gain);
      gain.connect(node);
      node.connect(silent);
      silent.connect(ctx.destination);

      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.55;
      source.connect(analyser);
      state.source = source;
      state.gainNode = gain;
      state.node = node;
      state.analyser = analyser;

      await connectWebSocket();
      state.running = true;
      state.sampleRate = state.ctx.sampleRate;
      el.sub.textContent = "已连接，正在等待 Mac 确认音频通道…";
      state.pingTimer = setInterval(() => {
        if (state.ws && state.ws.readyState === 1) {
          try { state.ws.send(JSON.stringify({ type: "ping", t: performance.now() })); } catch (_) {}
        }
      }, 2200);
      startClock();
      // The server's "ready" message will switch the UI to live. In case it is
      // delayed, do not leave the user staring at a disabled button forever.
      setTimeout(() => {
        if (state.running && !state.connected && !state.intentionalStop) {
          setError("Mac 未确认音频通道", "请确认手机与 Mac 仍在同一 Wi-Fi，然后重试。");
          toast("音频通道建立超时，请重试", true, 5000);
          cleanup({ silent: true });
        }
      }, 8000);
    } catch (error) {
      const message = describeError(error);
      setError("无法启动传音", message);
      toast(message, true, 5200);
      cleanup({ silent: true });
    }
  }

  function describeError(error) {
    const name = error && error.name ? error.name : "";
    const raw = error && error.message ? error.message : String(error || "");
    if (name === "NotAllowedError" || raw.indexOf("Permission") >= 0 || raw.indexOf("denied") >= 0) {
      return "麦克风权限被拒绝。请在浏览器的网站设置中允许麦克风，然后刷新本页重试。";
    }
    if (name === "NotFoundError" || name === "DevicesNotFoundError") {
      return "没有找到麦克风设备。";
    }
    if (name === "NotReadableError" || name === "TrackStartError") {
      return "麦克风正被其他 App 占用，请关闭占用麦克风的 App 后重试。";
    }
    if (name === "SecurityError") {
      return "浏览器因安全限制拒绝访问麦克风，请确认地址为 https:// 并允许权限。";
    }
    return raw || "发生未知错误，请重试。";
  }

  async function cleanup({ silent = false } = {}) {
    state.running = false;
    state.connected = false;
    state.intentionalStop = true;
    clearInterval(state.timer);
    clearInterval(state.pingTimer);
    state.timer = null;
    state.pingTimer = null;
    releaseWakeLock();

    if (state.ws) {
      try { if (state.ws.readyState === 1) state.ws.send(JSON.stringify({ type: "bye" })); } catch (_) {}
      try { state.ws.close(); } catch (_) {}
      state.ws = null;
    }
    if (state.stream) {
      state.stream.getTracks().forEach((track) => { try { track.stop(); } catch (_) {} });
      state.stream = null;
    }
    if (state.ctx) {
      try { await state.ctx.close(); } catch (_) {}
      state.ctx = null;
    }
    state.source = null;
    state.node = null;
    state.gainNode = null;
    state.analyser = null;
    setIdle();
    state.intentionalStop = false;
    state.starting = false;
  }

  async function stop() {
    if (!state.running && !state.starting) return;
    state.stopping = true;
    el.mainBtn.disabled = true;
    el.btnText.textContent = "正在停止…";
    state.intentionalStop = true;
    try {
      if (state.ws && state.ws.readyState === 1) {
        state.ws.send(JSON.stringify({ type: "bye" }));
      }
    } catch (_) {}
    await cleanup({ silent: false });
    clearError();
    state.stopping = false;
  }

  el.mainBtn.addEventListener("click", () => {
    if (state.running) stop();
    else start();
  });
  el.retryBtn.addEventListener("click", () => {
    clearError();
    if (state.running || state.starting) return;
    start();
  });
  el.gain.addEventListener("input", () => {
    state.gainValue = Number(el.gain.value) || 1;
    el.gainValue.textContent = state.gainValue.toFixed(1) + "×";
    if (state.gainNode) {
      state.gainNode.gain.setTargetAtTime(state.gainValue, state.ctx.currentTime, 0.02);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.running) {
      requestWakeLock();
      if (state.ctx && state.ctx.state === "suspended") state.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener("pagehide", () => {
    state.intentionalStop = true;
    cleanup({ silent: true });
  });

  function deviceName() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) return "Android 手机";
    return "手机麦克风";
  }

  function platformName() {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "浏览器";
    if (/iPhone/.test(ua)) return "iPhone · " + browser;
    if (/iPad/.test(ua)) return "iPad · " + browser;
    if (/Android/.test(ua)) return "Android · " + browser;
    return "手机 · " + browser;
  }

  el.quality.textContent = "48 kHz";
  setIdle();
  setPill("online", "Mac 在线");
})();
</script>
</body>
</html>
